name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pranex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pranex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pranex_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run security invariant tests
        run: npm test
      - name: Validate SQL migration on PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261025000100_inventory_ledger_fefo.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/inventory-fefo.integration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261025090000_marketplace_quote_intake.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261025091500_marketplace_quote_consent.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/marketplace-quote.integration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/product-batch-ledger-fixture.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261025120000_inventory_movement_ledger.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/product-batch-ledger.integration.sql
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
